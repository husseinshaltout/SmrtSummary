{% extends '_base.html' %}
{% load static %}
{% block content %}
<main class="px-16 py-6 bg-gray-100" data-video-fps="30">
  <div class="m-2">
    <h4 class="text-3xl font-semibold text-secondary-100">Select timestamp</h4>
    <div class="mt-8">
      <div
        id="canvas__container"
        style="width: 400px; height: 480px"
        class="relative mx-auto rounded-lg bg-gray-600"
      >
        <canvas id="video_summary_canvas" aria-label="Video summary scanline"></canvas>
        <img
          id="video_summary_image"
          src="{{ video_summary.url }}"
          style="display: none"
          alt="Generated video summary"
        />
      </div>
      <div class="flex items-center justify-around mt-8">
        <h3 class="text-lg font-semibold text-secondary-100">
          Time stamp: <span id="timestamp"></span>
        </h3>
        {% if video.videofile %}
          <a
            href="{{ video.videofile.url }}"
            target="_blank"
            rel="noopener noreferrer"
            class="text-sm rounded-full border-0 font-semibold py-2 px-4 bg-primary hover:bg-secondary-200 text-white"
          >
            Play video
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</main>
{% endblock %}
